<title>My Shop 4.2.5.0</title>
<meta name="claude:viewport-fit-sides" content="cover"><meta name="application-version" content="4.2.5.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap">
<style>
/* Concept: a shop counter in green and gold. Deep forest header and buttons (from the user's mockups),
   pale sage ground, gold reserved for the one action that matters: selling. System body face keeps the page light on slow data. */
:root{
  --bg:#F1F5F1; --surface:#FFFFFF; --surface2:#E8EFE9; --ink:#10261C; --muted:#586C60; --line:#D6E0D8;
  --green:#0E3B2C; --on-green:#F4F8F5; --btn:#0E3B2C; --on-btn:#FFFFFF;
  --gold:#F2B53C; --gold-soft:#FBEBC4; --on-gold:#2B2000;
  --good:#1B7F4F; --good-bg:#DDF1E5; --warn:#8A5E00; --warn-bg:#FBEFCB; --bad:#B8322A; --bad-bg:#F8DDD9;
  --chart:#14503B; --scrim:rgba(8,20,14,.55); --shadow:0 1px 2px rgba(16,38,28,.06),0 4px 14px rgba(16,38,28,.06);
  --f-display:'Sora',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  --f-body:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09160F; --surface:#112419; --surface2:#183024; --ink:#E6F0E9; --muted:#8FA699; --line:#24402F;
  --green:#0F3A2B; --on-green:#F4F8F5; --btn:#1E7550; --on-btn:#FFFFFF;
  --gold-soft:#3A2F10;
  --good:#4FCB8A; --good-bg:#12382A; --warn:#E9B949; --warn-bg:#3A2F10; --bad:#F0877D; --bad-bg:#40201C;
  --chart:#3F9A72; --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09160F; --surface:#112419; --surface2:#183024; --ink:#E6F0E9; --muted:#8FA699; --line:#24402F;
  --green:#0F3A2B; --on-green:#F4F8F5; --btn:#1E7550; --on-btn:#FFFFFF;
  --gold-soft:#3A2F10;
  --good:#4FCB8A; --good-bg:#12382A; --warn:#E9B949; --warn-bg:#3A2F10; --bad:#F0877D; --bad-bg:#40201C;
  --chart:#3F9A72; --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
.phone-field{display:flex;gap:8px;width:100%;align-items:stretch}.phone-field input[type="tel"],.phone-field input.phone-number{flex:1;min-width:0;width:0;max-width:100%}.country-selector{flex:0 0 105px;width:105px;min-width:95px}.country-trigger{display:flex;align-items:center;justify-content:center;gap:5px;width:105px;min-width:95px;min-height:44px;height:100%;padding:8px 5px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);white-space:nowrap;font-size:14px;font-weight:600}.country-menu{position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 24px));max-height:min(70vh,560px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 60px rgba(0,0,0,.3);padding:10px;display:flex;flex-direction:column;gap:8px}.country-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998}.country-search{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);color:var(--ink)}.country-options{overflow:auto;min-height:0}.country-option{display:flex;align-items:center;gap:8px;width:100%;padding:10px;border-radius:9px;text-align:left;white-space:normal}.country-option:hover,.country-option:focus{background:var(--surface2)}

html,body{min-height:100%;width:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
html.lock,html.lock body{overflow:hidden}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{flex:none;display:block}
.amt{white-space:nowrap;font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100vh}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

/* header */
.hdr{position:sticky;top:0;z-index:10;background:var(--green);color:var(--on-green)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;min-width:0}
.brand svg{color:var(--gold)}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand b{color:var(--gold);font-weight:700}
.pill{border:1px solid rgba(255,255,255,.28);color:var(--on-green);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;letter-spacing:.04em}

.main{padding-top:0;margin-top:0;padding-bottom:200px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-t{font-family:var(--f-display);font-size:15px;font-weight:600;margin:4px 0 -4px}
.muted{color:var(--muted)}
small,.sm{font-size:12.5px}

/* cards */
.hello{background:var(--green);color:var(--on-green);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.hello h2{font-size:18px}
.hello p{margin:0;opacity:.88}
.hello small{opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.tile .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.tile .lbl svg{color:var(--chart)}
.tile .val{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .sub{font-size:12.5px;color:var(--muted)}
.up{color:var(--good);font-weight:600}.down{color:var(--bad);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;font-weight:600;background:var(--btn);color:var(--on-btn);text-decoration:none;text-align:center}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.qa{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;min-height:56px}
.qa .qi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--chart)}
.qa.primary{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.qa.primary .qi{background:var(--gold);color:var(--on-gold)}
.qa.gold .qi{background:var(--gold);color:var(--on-gold)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:inherit}
.icon-btn:hover{background:var(--surface2)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-width:0}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface2)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.row .chev{color:var(--muted)}
.gem{display:inline-flex;align-items:center;gap:3px;margin-left:auto;font-size:13px;flex:none}
.gem b{font-size:9.5px;letter-spacing:.04em;background:#F2B53C;color:#2B2000;border-radius:99px;padding:1px 5px}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-width:0}
.in:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .in{padding-left:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:inline-flex;align-items:center;background:var(--surface2);border-radius:10px}
.step button{width:36px;height:36px;display:grid;place-items:center;font-size:18px;font-weight:700}
.step input{width:52px;text-align:center;border:0;background:transparent;font-weight:700;font-size:15px;min-height:36px;padding:0}

/* sales */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .in{flex:1;text-align:center;font-weight:600}
.datebar .icon-btn{background:var(--surface);border:1px solid var(--line)}
.datebar .icon-btn[disabled]{opacity:.35;pointer-events:none}
.sumcard{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.sumcard .big{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:300px;height:auto}
.bar{fill:var(--chart)}.bar.sel{fill:var(--gold)}
.axis{stroke:var(--line);stroke-width:1}
.ctext{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.ctext.sel{fill:var(--ink);font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--chart);border-radius:99px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:30;pointer-events:none}
.dock>*{pointer-events:auto}
.dock-fab{display:flex;justify-content:flex-end;padding-bottom:12px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.fab{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--on-gold);font-weight:700;border-radius:99px;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.nav button[aria-current="page"]{color:var(--chart)}
.nav button[aria-current="page"] svg{stroke-width:2.4}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{color:var(--gold)}}

/* v2 additions */
.pill b{color:var(--gold)}
.nav{grid-template-columns:repeat(6,1fr)}
.nav button{font-size:10.5px;padding:6px 0}
.aiic{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);margin-top:-16px;border:3px solid var(--surface);box-shadow:0 3px 10px rgba(0,0,0,.22)}
.nav button[aria-current="page"] .aiic{color:var(--on-gold)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.av.ph{overflow:hidden;background:var(--surface2)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.onb{position:fixed;inset:0;z-index:75;background:var(--bg);overflow:auto;display:flex;justify-content:center}
.onbbox{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.onbhd{background:var(--green);color:var(--on-green);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:8px}
.onbhd svg{color:var(--gold)}
.onbhd h1{font-size:24px}.onbhd p{margin:0;opacity:.88}
.photo{display:flex;align-items:center;gap:12px}
.photo .av{width:64px;height:64px;border-radius:14px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:0}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.msg.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start;box-shadow:var(--shadow)}
.msg.me{background:var(--btn);color:var(--on-btn);border-bottom-right-radius:4px;align-self:flex-end}
.askbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0;z-index:5}
.main.ai{padding-bottom:96px}
/* sell overlay */
.sell{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center}
.sellbox{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.sellhd{background:var(--green);color:var(--on-green);display:flex;align-items:center;gap:6px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.sellhd h2{flex:1;font-size:17px}
.sellhd .btn{min-height:38px;padding:6px 12px;font-size:13px}
.sellbody{flex:1;overflow:auto;padding-top:12px;padding-bottom:16px;display:flex;flex-direction:column;gap:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;box-shadow:var(--shadow)}
.pc b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pc .pr{font-weight:700;color:var(--chart);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .pc .pr{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pc .pr{color:var(--gold)}}
.pc.is-out{opacity:.5}
.qb{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:99px;background:var(--gold);color:var(--on-gold);font-style:normal;font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 7px}
.cartbar{background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.cartbar p{margin:0;text-align:center;color:var(--muted);font-size:13.5px;padding:10px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fade .15s ease}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;max-height:90%;overflow:auto;z-index:61;background:var(--surface);border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 6px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-h h2{font-size:18px}
.sheet-b{display:flex;flex-direction:column;gap:14px}
.cl{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl:last-of-type{border-bottom:0}
.cl-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cl-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function allOn(k){return S.sales.filter(function(s){return dk(s.ts)===k})}

function saleProfit(s){return s.items.reduce(function(a,i){return a+(i.price-(i.cost||0))*i.qty},0)-(s.discount||0)}
function balance(cid){
  var d=S.sales.filter(function(s){return s.cid===cid&&!s.void}).reduce(function(a,s){return a+(s.debt||0)},0);
  var p=S.pays.filter(function(x){return x.cid===cid}).reduce(function(a,x){return a+x.amount},0);

/* ── Crédit avancé ─────────────────────────────────────────────────────────
   creditStatus(c) => {overdue:bool, daysLate:int, dueSoon:bool, oldestTs:int|null}
   Cherche la vente à crédit la plus ancienne non totalement remboursée.
   trustScore(c) => 'good'|'ok'|'new'|'bad'
*/
function creditStatus(c){
  var delay=c.creditDelay||7; /* jours par défaut */
  var now=Date.now();
  var sales=S.sales.filter(function(s){return s.cid===c.id&&s.debt>0&&!s.void});
  if(!sales.length)return{overdue:false,daysLate:0,dueSoon:false,oldestTs:null};
  /* vente à crédit la plus ancienne */
  var oldest=sales.reduce(function(a,s){return s.ts<a.ts?s:a},sales[0]);
  var dueTs=oldest.ts+delay*864e5;
  var diffMs=now-dueTs;
  var daysLate=Math.floor(diffMs/864e5);
  return{
    overdue:diffMs>0,
    daysLate:Math.max(0,daysLate),
    dueSoon:diffMs>-2*864e5&&diffMs<=0, /* dans moins de 2j */
    oldestTs:oldest.ts
  };
}
function trustScore(c){
  var paidSales=S.sales.filter(function(s){return s.cid===c.id&&s.debt>0&&!s.void});
  if(!paidSales.length)return 'new';
  var delay=c.creditDelay||7;
  var late=0,total=paidSales.length;
  S.pays.forEach(function(p){
    if(p.cid!==c.id)return;
    /* trouver la vente la plus ancienne avant ce paiement */
    var rel=paidSales.filter(function(s){return s.ts<=p.ts});
    if(!rel.length)return;
    var oldest=rel.reduce(function(a,s){return s.ts<a.ts?s:a},rel[0]);
    var dueTs=oldest.ts+delay*864e5;
    if(p.ts>dueTs+864e5)late++; /* payé plus d'1j après l'échéance */
  });
  if(total===0)return 'new';
  var lateRate=late/total;
  if(lateRate===0)return 'good';
  if(lateRate<0.4)return 'ok';
  return 'bad';
}
function trustLabel(score){
  if(score==='good')return t('trustGood');
  if(score==='ok')return t('trustOk');
  if(score==='bad')return t('trustBad');
  return t('trustNew');
}

function randHex(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function pinHash(pin,salt){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256)}).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}

ice que vous demandez (activation, aide), sur notre intérêt légitime à éviter la fraude et sur votre consentement lorsque vous nous envoyez volontairement des informations.</p><h4>6. Combien de temps nous les gardons</h4><p>Les données de votre téléphone y restent jusqu’à ce que vous les supprimiez. Les informations de paiement et d’activation que nous recevons sont conservées pendant [durée de l’abonnement plus 12 mois], puis supprimées, sauf obligation légale de les garder plus longtemps (par exemple pour la comptabilité). Les messages d’aide sont conservés [12 mois].</p><h4>7. Avec qui nous les partageons</h4><p>Nous ne vendons pas vos données. Elles peuvent passer par des prestataires nécessaires au service : WhatsApp (Meta) pour les messages, MTN ou Orange pour les paiements Mobile Money, et l’hébergeur du site de l’application, qui peut enregistrer des journaux techniques standard (adresse IP, type d’appareil, date) quand l’application est chargée. Nous pouvons aussi divulguer des données si la loi ou une autorité compétente nous y oblige.</p><h4>8. Transferts hors de votre pays</h4><p>Certains prestataires peuvent traiter des données hors du Cameroun. Nous choisissons des prestataires reconnus et limitons les données envoyées à ce qui est nécessaire.</p><h4>9. Stockage local, bluetooth et autorisations</h4><p>L’application utilise le stockage local de votre navigateur ou de votre téléphone pour fonctionner hors ligne. Elle demande l’accès au Bluetooth uniquement lorsque vous imprimez sur une imprimante, et seulement vers l’appareil que vous choisissez. Elle n’utilise ni votre position, ni vos contacts, ni votre micro sans que vous l’autorisiez à chaque fois.</p><h4>10. Sécurité</h4><p>Nous prenons des mesures raisonnables pour protéger les données que nous recevons. Pour celles de votre téléphone, la sécurité dépend aussi de vous : verrouillez votre téléphone, choisissez un code PIN que personne ne devine, ne laissez pas un inconnu utiliser le mode Patron, et faites des sauvegardes. En cas de fuite de données qui vous concerne, nous vous informerons dans les meilleurs délais et préviendrons les autorités si la loi l’exige.</p><h4>11. Vos droits</h4><p>Vous pouvez demander l’accès aux données que nous détenons sur vous, leur correction, leur suppression, la limitation ou l’opposition à leur traitement, et retirer votre consentement à tout moment. Écrivez-nous à [e-mail] ou sur WhatsApp au [numéro]. Nous répondons dans un délai raisonnable, en général sous [30 jours]. Vous pouvez aussi saisir l’autorité de protection des données de votre pays.</p><h4>12. Enfants</h4><p>L’application s’adresse aux commerçants adultes. Nous ne collectons pas sciemment de données sur des mineurs. Si vous pensez qu’un mineur nous a envoyé des données, contactez-nous et nous les supprimerons.</p><h4>13. Supprimer vos données</h4><p>Sur votre téléphone, utilisez « Effacer les données de la boutique » (réservé au Patron, avec le code PIN) ou désinstallez l’application. Pour supprimer les données que nous détenons, écrivez-nous : nous les effaçons sauf obligation légale de les conserver.</p><h4>14. Modification de cette politique</h4><p>Nous pouvons mettre à jour cette politique. La date de la dernière mise à jour figure en haut, et nous vous informerons dans l’application en cas de changement important.</p><h4>15. Contact</h4><p>[Nom], WhatsApp [numéro], [e-mail], [adresse].</p>";

function sha256hex(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function subCode(shopId,plan,date){return sha256hex('MYSHOP|'+shopId+'|'+plan+'|'+date+'|'+SUB_SECRET).then(function(h){return h.slice(0,4).toUpperCase()})}

function ic(n,s){s=s||20;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
function av(name,size,img){
  if(img)return '<span class="av ph" style="'+(size?'width:'+size+'px;height:'+size+'px':'')+'" aria-hidden="true"><img src="'+esc(img)+'" alt=""></span>';
  var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))|0;var hue=[150,165,135,100,180,120][Math.abs(h)%6];
  var w=name.trim().split(/\s+/);var ini=(w[0]||'?').charAt(0)+(w.length>1?w[1].charAt(0):(w[0]||'').charAt(1));
  return '<span class="av" style="background:hsl('+hue+' 40% 28%);'+(size?'width:'+size+'px;height:'+size+'px':'')+'" aria-hidden="true">'+esc(ini.toUpperCase())+'</span>';
}

/* ---------- views: home ---------- */
function renderHome(){
  var k=dk(Date.now()),y=dk(Date.now()-864e5);
  var td=salesOn(k),yd=salesOn(y);
  var tot=sumBy(td,'total'),ytot=sumBy(yd,'total');
  var qty=td.reduce(function(a,s){return a+s.items.reduce(function(b,i){return b+i.qty},0)},0);
  var prof=td.reduce(function(a,s){return a+saleProfit(s)},0),ex=expTotal(expOn(k)),net=money(prof-ex);
  var msg=!td.length?t('msg0'):(tot>=ytot?t('msgUp'):t('msgDown',fmt(ytot)));
  var pct=ytot>0?Math.round((tot-ytot)/ytot*100):null;
  var debt=totalDebt(),nd=S.customers.filter(function(c){return balance(c.id)>0}).length;
  var inS=S.products.filter(function(p){return p.qty>0}).length;
  var lows=S.products.filter(function(p){return p.qty<=p.low}).sort(function(a,b){return a.qty-b.qty});
  var h=storageBanner()+demoBanner();
  h+=renewBanner()+backupBanner();h+='<section class="hello"><h2>'+greeting()+(S.shop.owner?' '+esc(S.shop.owner)+' 👋':',')+'</h2><p>'+msg+'</p><small>'+fmtDate(Date.now(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(S.shop.city?' · '+esc(S.shop.city):'')+'</small></section>';
  h+='<div class="grid2">'+
   '<div class="tile"><span class="lbl">'+ic('cart',18)+t('salesToday')+'</span><span class="val amt">'+fmt(tot)+'</span><span class="sub">'+(pct==null?t('nItems',fmtQ(qty),td.length):'<span class="'+(pct>=0?'up':'down')+'">'+(pct>=0?'↑ +':'↓ ')+pct+'%</span> · '+t('nItems',fmtQ(qty),td.length))+'</span></div>'+
   '<div class="tile"><span class="lbl">'+ic('trend',18)+t('profitNet')+'</span><span class="val amt">'+fmt(net)+'</span><span class="sub">'+(ex?t('afterExp',fmt(ex)):t('today'))+'</span></div>'+
   '<button class="tile" style="text-align:left" data-a="tab" data-v="clients"><span class="lbl">'+ic('coins',18)+t('debts')+'</span><span class="val amt">'+fmt(debt)+'</span><span class="sub">'+t('nClients',nd)+'</span></button>'+
   '<button class="tile" style="text-align:left" data-a="tab" data-v="stock"><span class="lbl">'+ic('box',18)+t('inStock')+'</span><span class="val">'+inS+'</span><span class="sub">'+(lows.length?'<span class="down">'+t('nLow',lows.length)+'</span>':t('allOk'))+'</span></button></div>';
  h+='<div class="sec-t">'+t('quick')+'</div><div class="grid2">'+
   '<button class="qa primary" data-a="sell-open"><span class="qi">'+ic('cart',20)+'</span>'+t('newSale')+'</button>'+
   '<button class="qa gold" data-a="prod-new"><span class="qi">'+ic('plus',20)+'</span>'+t('addProduct')+'</button>'+
   '<button class="qa" data-a="tab" data-v="stock"><span class="qi">'+ic('box',20)+'</span>'+t('viewStock')+'</button>'+
   '<button class="qa" data-a="tab" data-v="sales"><span class="qi">'+ic('bars',20)+'</span>'+t('history')+'</button>'+
   '<button class="qa" data-a="exp-new"><span class="qi">'+ic('wallet',20)+'</span>'+t('addExp')+'</button>'+
   '<button class="qa" data-a="tab" data-v="ai"><span class="qi">'+ic('spark',20)+'</span>'+t('ai')+'</button></div>';
  h+='<div class="sec-t">'+t('restock')+'</div>';
  if(!lows.length)h+='<div class="card muted">'+t('allGood')+'</div>';
  else h+='<div class="list">'+lows.slice(0,4).map(function(p){return '<button class="row" data-a="prod-edit" data-id="'+p.id+'">'+av(p.name,null,p.img)+'<span class="grow"><span class="t" style="display:block">'+esc(p.name)+'</span><span class="s" style="display:block">'+(p.qty<=0?t('out'):fmtQ(p.qty)+' '+esc(p.unit))+'</span></span><span class="tag '+(p.qty<=0?'bad':'warn')+'">'+(p.qty<=0?t('out'):t('low'))+'</span></button>'}).join('')+'</div>';
  return h;

/* ---------- views: sales ---------- */
function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v)));var n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function chartHTML(){
  var days=[],i;
  for(i=6;i>=0;i--){var d=parseKey(ui.salesDate);d.setDate(d.getDate()-i);var k=dk(d);days.push({k:k,d:d,v:sumBy(salesOn(k),'total')})}
  var max=niceMax(Math.max.apply(null,days.map(function(x){return x.v}).concat([1])));
  var W=340,H=190,L=40,R=6,Tp=18,B=26,pw=W-L-R,ph=H-Tp-B,col=pw/7,bw=col*0.58;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t('last7')+'">';
  [0,0.5,1].forEach(function(f){var y=Tp+ph-f*ph;s+='<line class="axis" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ctext" x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+fmtShort(max*f)+'</text>'});
  days.forEach(function(x,j){
    var h=x.v/max*ph,bx=L+j*col+(col-bw)/2,by=Tp+ph-h,sel=x.k===ui.salesDate;
    s+='<g data-a="day" data-v="'+x.k+'" role="button" tabindex="0" aria-label="'+esc(fmtDate(x.d,{day:'numeric',month:'short'}))+': '+esc(fmt(x.v))+'" style="cursor:pointer">'+
      '<rect x="'+(L+j*col)+'" y="'+Tp+'" width="'+col+'" height="'+(ph+B)+'" fill="transparent"/>'+
      (x.v>0?'<rect class="bar'+(sel?' sel':'')+'" x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3"/><text class="ctext'+(sel?' sel':'')+'" x="'+(bx+bw/2).toFixed(1)+'" y="'+(by-4).toFixed(1)+'" text-anchor="middle">'+fmtShort(x.v)+'</text>':'')+
      '<text class="ctext'+(sel?' sel':'')+'" x="'+(L+j*col+col/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(fmtDate(x.d,{weekday:'short'}).replace('.','').slice(0,3))+'</text></g>';
  });
  return s+'</svg>';
}
function renderSales(){
  var k=ui.salesDate,list=allOn(k).sort(function(a,b){return b.ts-a.ts});
  var live=list.filter(function(s){return !s.void}),tot=sumBy(live,'total'),prof=live.reduce(function(a,s){return a+saleProfit(s)},0),today=dk(Date.now()),ex=expTotal(expOn(k)),net=money(prof-ex);
  var h=storageBanner()+demoBanner();
  h+='<div class="datebar"><button class="icon-btn" data-a="day-step" data-v="-1" aria-label="'+t('prevDay')+'">'+ic('back',20)+'</button>'+
     '<input class="in" type="date" id="salesDate" data-ch="date" value="'+k+'" max="'+today+'" aria-label="Date">'+
     '<button class="icon-btn" data-a="day-step" data-v="1" '+(k>=today?'disabled':'')+' aria-label="'+t('nextDay')+'">'+ic('chev',20)+'</button></div>';
  h+='<div class="card sumcard"><div><div class="muted sm">'+t('total')+' · '+t('nSales',live.length)+'</div><div class="big amt">'+fmt(tot)+'</div></div><div style="text-align:right"><div class="muted sm">'+t('profitNet')+'</div><div class="amt" style="font-weight:700">'+fmt(net)+'</div>'+(ex?'<div class="muted sm">−'+fmt(ex)+' '+esc(t('expenses').toLowerCase())+'</div>':'')+'</div></div>';
  h+='<div class="seg" role="group"><button data-a="view" data-v="list" aria-pressed="'+(ui.salesView==='list')+'">'+t('list')+'</button><button data-a="view" data-v="chart" aria-pressed="'+(ui.salesView==='chart')+'">'+t('chart')+'</button></div>';
  if(ui.salesView==='list'){
    h+=list.length?'<div class="list">'+list.map(function(s){
      var names=s.items.map(function(i){return fmtQ(i.qty)+' '+i.name}).join(', ');var c=s.cid?custById(s.cid):null;
      return '<button class="row'+(s.void?' void':'')+'" data-a="sale-open" data-id="'+s.id+'"><span class="grow"><span class="t" style="display:block">'+esc(names)+'</span><span class="s" style="display:block">'+fmtTime(s.ts)+' · '+methodLbl(s.method)+(c?' · '+esc(c.name):'')+(s.void?' · <b>'+t('void_tag')+'</b>':'')+'</span></span><span class="r amt">'+fmt(s.total)+'</span></button>'}).join('')+'</div>'
      :'<div class="card empty"><span>'+t('noSales')+'</span></div>';
  }else{
    h+='<div class="card"><div class="sec-t" style="margin:0 0 8px">'+t('last7')+'</div><div class="chartbox">'+chartHTML()+'</div></div>';
    var by={cash:0,mobile:0,credit:0};live.forEach(function(s){by[s.method]=(by[s.method]||0)+s.total});
    h+='<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="sec-t" style="margin:0">'+t('byMethod')+'</div>'+['cash','mobile','credit'].map(function(m){
      var pc=tot>0?by[m]/tot*100:0;return '<div><div class="sumrow"><span>'+methodLbl(m)+'</span><b class="amt">'+fmt(by[m])+'</b></div><div class="meter"><i style="width:'+pc.toFixed(1)+'%"></i></div></div>'}).join('')+'</div>';
    var agg={},from=parseKey(k);from.setDate(from.getDate()-6);var fk=dk(from);
    S.sales.forEach(function(s){var d=dk(s.ts);if(!s.void&&d>=fk&&d<=k)s.items.forEach(function(i){var a=agg[i.name]||(agg[i.name]={n:i.name,q:0,r:0,u:i.unit});a.q+=i.qty;a.r+=i.price*i.qty})});
    var top=Object.keys(agg).map(function(x){return agg[x]}).sort(function(a,b){return b.r-a.r}).slice(0,5);
    if(top.length)h+='<div class="sec-t">'+t('topProducts')+'</div><div class="list">'+top.map(function(a){return '<div class="row">'+av(a.n)+'<span class="grow"><span class="t" style="display:block">'+esc(a.n)+'</span><span class="s" style="display:block">'+fmtQ(a.q)+' '+esc(a.u||'')+'</span></span><span class="r amt">'+fmt(a.r)+'</span></div>'}).join('')+'</div>';
  }
  return h;
}

/* ---------- views: stock ---------- */
function stockListHTML(){
  var q=ui.q.stock.trim().toLowerCase(),f=ui.stockFilter;
  var arr=S.products.filter(function(p){return (!q||p.name.toLowerCase().indexOf(q)>-1)&&(f==='all'||(f==='low'&&p.qty>0&&p.qty<=p.low)||(f==='out'&&p.qty<=0))&&(ui.cat==='all'||p.cat===ui.cat)}).sort(function(a,b){return a.name.localeCompare(b.name,lang())});
  if(!S.products.length)return '<div class="card empty"><span>'+t('noProducts')+'</span><button class="btn gold" data-a="prod-new">'+ic('plus',18)+t('addFirst')+'</button></div>';
  if(!arr.length)return '<div class="card empty"><span>'+t('noMatch')+'</span></div>';
  return '<div class="list">'+arr.map(function(p){var st=stockState(p);
    return '<button class="row" data-a="prod-edit" data-id="'+p.id+'">'+av(p.name,null,p.img)+'<span class="grow"><span class="t" style="display:block">'+esc(p.name)+'</span><span class="s" style="display:block"><span class="amt">'+fmt(p.price)+'</span> / '+esc(p.unit||t('unit'))+'</span></span>'+
    '<span style="text-align:right;flex:none"><span class="amt" style="font-weight:700;display:block">'+fmtQ(p.qty)+' <small class="muted" style="font-weight:500">'+esc(p.unit||'')+'</small></span>'+(st==='ok'?'':'<span class="tag '+(st==='out'?'bad':'warn')+'">'+(st==='out'?t('out'):t('low'))+'</span>')+'</span></button>'}).join('')+'</div>';
}
function renderStock(){
  var val=S.products.reduce(function(a,p){return a+Math.max(p.qty,0)*(p.cost||0)},0);
  var h=storageBanner()+demoBanner();
  h+='<div class="card sumcard"><div><div class="muted sm">'+t('stockValue')+'</div><div class="big amt">'+fmt(val)+'</div></div><div class="muted sm" style="text-align:right">'+t('nProducts',S.products.length)+'</div></div>';
  h+='<div class="searchbox">'+ic('search',18)+'<input class="in" id="stockQ" data-in="q-stock" type="search" placeholder="'+esc(t('search'))+'" value="'+esc(ui.q.stock)+'" autocomplete="off"></div>';
  h+='<div class="chips">'+[['all',t('all')],['low',t('low')],['out',t('outS')]].map(function(c){return '<button class="chip" data-a="filter" data-v="'+c[0]+'" aria-pressed="'+(ui.stockFilter===c[0])+'">'+c[1]+'</button>'}).join('')+'<button class="chip" data-a="prod-new" style="margin-left:auto">+ '+t('add')+'</button></div>';
  h+=catChips(ui.cat,'cat')+'<div id="stockList">'+stockListHTML()+'</div>';
  return h;
}

/* ---------- views: clients ---------- */
function renderClients(){
  /* tri : retardataires > échéance proche > dette > à jour */
  var arr=S.customers.map(function(c){var b=balance(c.id);var st=b>0?creditStatus(c):{overdue:false,daysLate:0,dueSoon:false};return{c:c,b:b,st:st}}).sort(function(a,b){
    var ap=a.st.overdue?2:a.st.dueSoon?1:a.b>0?0:-1;
    var bp=b.st.overdue?2:b.st.dueSoon?1:b.b>0?0:-1;
    if(bp!==ap)return bp-ap;
    return b.b-a.b;
  });
  var h=storageBanner()+demoBanner();
  h+='<div class="card sumcard"><div><div class="muted sm">'+t('debtTotal')+'</div><div class="big amt">'+fmt(totalDebt())+'</div></div><button class="btn gold sm" data-a="cust-new">'+ic('plus',16)+t('add')+'</button></div>';
  h+=arr.length?'<div class="list">'+arr.map(function(x){return '<button class="row" data-a="cust-open" data-id="'+x.c.id+'">'+av(x.c.name)+'<span class="grow"><span class="t" style="display:block">'+esc(x.c.name)+'</span><span class="s" style="display:block">'+(x.c.phone?esc(x.c.phone):'—')+'</span></span>'+
    (x.b>0?(
      '<span class="r" style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px">'+
      '<span class="amt" style="color:var(--bad)">'+fmt(x.b)+'</span>'+
      (x.st.overdue?'<span class="cust-overdue">'+t('overdueBy',x.st.daysLate+'j')+'</span>':
       x.st.dueSoon?'<span class="cust-soon">'+t('dueSoon')+'</span>':'')+'</span>'
    ):'<span class="tag good">'+t('settled')+'</span>')+
    '<span class="chev">'+ic('chev',18)+'</span></button>'}).join('')+'</div>'
    :'<div class="card empty"><span>'+t('noClients')+'</span><button class="btn gold" data-a="cust-new">'+ic('plus',18)+t('addClient')+'</button></div>';
  return h;
}

/* ── validatePhone(inputId) ──────────────────────────────────────────────
   Retourne {ok:true, full:'CC+local'} ou {ok:false, msg:'...'}.
   Utilise le CountrySelector associé au champ pour connaitre l indicatif.
   Regles Cameroun (237): 9 chiffres locaux, 1er chiffre = 6, prefixes operateurs.
   Autres pays: longueur locale 5-15 chiffres. */
function validatePhone(inputId){
  var fr=lang()==='fr';
  var input=document.getElementById(inputId);
  if(!input)return {ok:false,msg:fr?'Champ introuvable.':'Field not found.'};
  var raw=String(input.value||'').trim();
  var digits=raw.replace(/\D/g,'');
  if(!digits){
    return {ok:false,msg:fr?'Le numero de telephone est obligatoire.':'Phone number is required.'};
  }
  var box=input.closest('.phone-field');
  var sel=box&&box.querySelector('[data-ch="phone-country"]');
  var cc=sel?String(sel.value||'237').replace(/\D/g,''):'237';
  var local=digits.indexOf(cc)===0?digits.slice(cc.length):digits;
  if(cc==='237'){
    if(local.length<9)return {ok:false,msg:fr?'Numero incomplet, il manque des chiffres.':'Incomplete number, digits are missing.'};
    if(local.length>9)return {ok:false,msg:fr?'Numero invalide, trop long.':'Invalid number, too long.'};
    if(local.charAt(0)!=='6')return {ok:false,msg:fr?'Numero invalide (doit commencer par 6).':'Invalid number (must start with 6).'};
    var pre3=parseInt(local.slice(0,3),10);
    var op='';
    if(pre3>=650&&pre3<=659)op='MTN MoMo';
    else if(pre3>=670&&pre3<=679)op='MTN MoMo';
    else if(pre3>=680&&pre3<=689)op='MTN MoMo';
    else if(pre3>=690&&pre3<=699)op='Orange Money';
    else if(pre3>=660&&pre3<=669)op='Nexttel';
    else if(pre3>=622&&pre3<=625)op='Camtel';
    return {ok:true,full:cc+local,op:op};
  } else {
    if(local.length<5)return {ok:false,msg:fr?'Numero incomplet.':'Incomplete number.'};
    if(local.length>15)return {ok:false,msg:fr?'Numero invalide, trop long.':'Invalid number, too long.'};
    return {ok:true,full:cc+local};
  }
}
/* validatePhoneRaw(digits, cc) — memes regles sans DOM (paywall assemblé manuellement) */
function validatePhoneRaw(raw,cc){
  var fr=lang()==='fr';
  var digits=String(raw||'').replace(/\D/g,'');
  var code=String(cc||'237').replace(/\D/g,'');
  if(!digits)return {ok:false,msg:fr?'Le numero de telephone est obligatoire.':'Phone number is required.'};
  var local=digits.indexOf(code)===0?digits.slice(code.length):digits;
  if(code==='237'){
    if(local.length<9)return {ok:false,msg:fr?'Numero incomplet, il manque des chiffres.':'Incomplete number, digits are missing.'};
    if(local.length>9)return {ok:false,msg:fr?'Numero invalide, trop long.':'Invalid number, too long.'};
    if(local.charAt(0)!=='6')return {ok:false,msg:fr?'Numero invalide (doit commencer par 6).':'Invalid number (must start with 6).'};
  } else {
    if(local.length<5)return {ok:false,msg:fr?'Numero incomplet.':'Incomplete number.'};
    if(local.length>15)return {ok:false,msg:fr?'Numero invalide, trop long.':'Invalid number, too long.'};
  }
  return {ok:true,full:code+local};
}

function viewJournal(fr){
  var L=(S.audit||[]).slice(-40).reverse();
  return mxTop(tx('Journal d’activité','Activity log'),'menu')+'<div class="mx-card">'+(L.length?L.map(function(a){return '<div class="mx-row" style="flex-direction:column;align-items:flex-start;gap:2px"><span class="mx-sub">'+fmtDate(a.ts,{day:'numeric',month:'short'})+' '+fmtTime(a.ts)+' · '+esc(a.role)+'</span><span>'+esc(a.detail)+'</span></div>'}).join(''):'<p class="mx-note" style="padding:14px 0">'+t('audit_empty')+'</p>')+'</div>';
}
function rapData(ts){
  var mk=monthKey(ts);
  var ss=S.sales.filter(function(s){return !s.void&&monthKey(s.ts)===mk});
  var rev=0,cogs=0,prod={},days=[0,0,0,0,0,0,0];
  ss.forEach(function(s){
    rev+=s.total; days[new Date(s.ts).getDay()]+=s.total;
    s.items.forEach(function(i){
      var k=i.pid||i.name; var o=prod[k]||(prod[k]={name:i.name,rev:0,pro:0,qty:0});
      o.rev+=i.price*i.qty; o.pro+=(i.price-(i.cost||0))*i.qty; o.qty+=i.qty; cogs+=(i.cost||0)*i.qty;
    });
  });
  var ex=expTotal(S.expenses.filter(function(e){return monthKey(e.ts)===mk}));
  return {n:ss.length,rev:money(rev),cogs:money(cogs),ex:money(ex),net:money(rev-cogs-ex),prod:Object.keys(prod).map(function(k){return prod[k]}),days:days};
}
function rapChange(a,b){if(!b)return '';var p=Math.round((a-b)/Math.abs(b)*100);return '<span class="mx-v" style="color:'+(p>=0?'var(--good)':'var(--bad)')+'">'+(p>=0?'▲ +':'▼ ')+p+'%</span>'}
function viewRap(fr){
  var h=mxTop(tx('Rapport du mois','Monthly report'),'menu');
  var now=new Date(), cur=rapData(now.getTime()), prev=rapData(new Date(now.getFullYear(),now.getMonth()-1,15).getTime());
  var owed=0;S.customers.forEach(function(c){var b=balance(c.id);if(b>0)owed+=b});
  var mo=now.toLocaleDateString(fr?'fr-FR':'en-GB',{month:'long',year:'numeric'});
  h+='<p class="mx-note" style="margin:0 0 8px">'+esc(mo)+'</p>';
  h+='<div class="mx-card mx-pad"><div class="mx-tiles" style="padding:0">'+
    '<div><small>'+(tx('Chiffre d’affaires','Revenue'))+'</small><b>'+fmt(cur.rev)+'</b>'+rapChange(cur.rev,prev.rev)+'</div>'+
    '<div><small>'+(tx('Bénéfice net','Net profit'))+'</small><b>'+fmt(cur.net)+'</b>'+rapChange(cur.net,prev.net)+'</div>'+
    '<div><small>'+(tx('Ventes','Sales'))+'</small><b>'+cur.n+'</b>'+rapChange(cur.n,prev.n)+'</div></div>'+
    '<p class="mx-note">'+(tx('Variation par rapport au mois précédent.','Change compared with last month.'))+'</p></div>';
  h+='<div class="mx-sec">'+(tx('Calcul du bénéfice','How profit is calculated'))+'</div><div class="mx-card">'+
    '<div class="mx-row"><span class="mx-t">'+(tx('Chiffre d’affaires','Revenue'))+'</span><span class="mx-v">'+fmt(cur.rev)+'</span></div>'+
    '<div class="mx-row"><span class="mx-t">− '+(tx('Coût des marchandises vendues','Cost of goods sold'))+'</span><span class="mx-v">'+fmt(cur.cogs)+'</span></div>'+
    '<div class="mx-row"><span class="mx-t">− '+(tx('Dépenses du mois','Expenses this month'))+'</span><span class="mx-v">'+fmt(cur.ex)+'</span></div>'+
    '<div class="mx-row"><span class="mx-t"><b>= '+(tx('Bénéfice net','Net profit'))+'</b></span><span class="mx-v"><b>'+fmt(cur.net)+'</b></span></div></div>';
  var top=function(list,key){return list.slice().sort(function(x,y){return y[key]-x[key]}).slice(0,5)};
  var rowsTop=function(list,key){return list.length?list.map(function(p){return '<div class="mx-row"><span class="mx-t"><b>'+esc(p.name)+'</b><span class="mx-sub" style="display:block">'+fmtQ(p.qty)+' · '+(tx('CA ','Rev. '))+fmt(money(p.rev))+'</span></span><span class="mx-v">'+fmt(money(p[key]))+'</span></div>'}).join(''):'<div class="mx-row"><span class="mx-sub">'+(tx('Aucune vente ce mois-ci.','No sales this month.'))+'</span></div>'};
  h+='<div class="mx-sec">'+(tx('Meilleurs produits (bénéfice)','Top products (profit)'))+'</div><div class="mx-card">'+rowsTop(top(cur.prod,'pro'),'pro')+'</div>';
  h+='<div class="mx-sec">'+(tx('Meilleurs produits (chiffre d’affaires)','Top products (revenue)'))+'</div><div class="mx-card">'+rowsTop(top(cur.prod,'rev'),'rev')+'</div>';
  var dn=fr?['Dim','Lun','Mar','Mer','Jeu','Ven','Sam']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var mx=Math.max.apply(null,cur.days.concat([1]));
  h+='<div class="mx-sec">'+(tx('Ventes par jour de la semaine','Sales by weekday'))+'</div><div class="mx-card mx-pad">'+
    dn.map(function(d,i){return '<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:36px" class="mx-sub">'+d+'</span><div style="flex:1;background:var(--surface2);border-radius:6px;height:10px;overflow:hidden"><div style="width:'+Math.round(cur.days[i]/mx*100)+'%;height:100%;background:var(--gold)"></div></div><span class="mx-sub">'+fmt(money(cur.days[i]))+'</span></div>'}).join('')+'</div>';
  h+='<div class="mx-sec">'+(tx('Clients et stock','Customers and stock'))+'</div><div class="mx-card">'+
    '<div class="mx-row"><span class="mx-t">'+(tx('Dettes clients à encaisser','Customer debts to collect'))+'</span><span class="mx-v">'+fmt(money(owed))+'</span></div>'+
    '<div class="mx-row"><span class="mx-t">'+(tx('Valeur du stock (prix d’achat)','Stock value (purchase price)'))+'</span><span class="mx-v">'+fmt(money(stockVal()))+'</span></div>'+
    '<div class="mx-row"><span class="mx-t">'+(tx('Produits en rupture','Products out of stock'))+'</span><span class="mx-v">'+S.products.filter(function(p){return p.qty<=0}).length+'</span></div></div>';
  return h;
}

/* ---------- assistant (local: answers from the shop data, works offline) ---------- */
function L(fr,en){return lang()==='fr'?fr:en}
function nz(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function anyOf(q,ws){for(var i=0;i<ws.length;i++)if(q.indexOf(ws[i])>-1)return true;return false}
var STOP=['les','des','une','mes','pour','the','and','sac'];
function words(s){return nz(s).split(/[^a-z0-9]+/).filter(function(w){return w.length>=3&&STOP.indexOf(w)<0})}
function wmatch(a,b){return a===b||(a.length>=4&&b.length>=4&&(a.indexOf(b)===0||b.indexOf(a)===0))}
function findBy(arr,q){var tk=words(q),best=null,bl=0;arr.forEach(function(x){words(x.name).forEach(function(w){tk.forEach(function(k){if(wmatch(k,w)&&w.length>bl){best=x;bl=w.length}})})});return best}
function period(q){
  var today=dk(Date.now()),p={from:today,to:today,lbl:tx('aujourd’hui','today'),ex:false};
  if(anyOf(q,['hier','yesterday'])){p.from=p.to=dk(Date.now()-864e5);p.lbl=tx('hier','yesterday');p.ex=true}
  else if(anyOf(q,['semaine','week','7 jours','7 days'])){var d=new Date();d.setDate(d.getDate()-6);p.from=dk(d);p.lbl=tx('sur les 7 derniers jours','over the last 7 days');p.ex=true}
  else if(anyOf(q,['mois','month'])){p.from=today.slice(0,8)+'01';p.lbl=tx('ce mois-ci','this month');p.ex=true}
  return p;
}
function stats(pr,pid){
  var ss=S.sales.filter(function(s){var d=dk(s.ts);return !s.void&&d>=pr.from&&d<=pr.to});
  var ee=S.expenses.filter(function(e){var d=dk(e.ts);return d>=pr.from&&d<=pr.to});
  var tot=0,gp=0,qty=0;
  ss.forEach(function(s){
    if(pid){s.items.forEach(function(i){if(i.pid===pid){tot+=i.price*i.qty;gp+=(i.price-(i.cost||0))*i.qty;qty+=i.qty}})}
    else{tot+=s.total;gp+=saleProfit(s);s.items.forEach(function(i){qty+=i.qty})}
  });
  return {n:ss.length,tot:money(tot),gp:money(gp),qty:qty,ex:expTotal(ee),exl:ee};
}
function topProducts(pr,n){
  var agg={};S.sales.forEach(function(s){var d=dk(s.ts);if(!s.void&&d>=pr.from&&d<=pr.to)s.items.forEach(function(i){var a=agg[i.name]||(agg[i.name]={n:i.name,q:0,r:0,u:i.unit});a.q+=i.qty;a.r+=i.price*i.qty})});
  return Object.keys(agg).map(function(k){return agg[k]}).sort(function(a,b){return b.r-a.r}).slice(0,n);
}
function lowList(){return S.products.filter(function(p){return p.qty<=p.low}).sort(function(a,b){return a.qty-b.qty})}
function stockVal(){return S.products.reduce(function(a,p){return a+Math.max(p.qty,0)*(p.cost||0)},0)}

}

 {"k": ["nouvelle boutique", "plusieurs boutiques", "new shop", "several shops", "two shops"], "fr": "Créer plusieurs boutiques n’est pas encore disponible. Ce sera possible avec la version en ligne.", "en": "Creating several shops is not available yet. It will come with the online version."}];
function kbAnswer(q){var best=null,bs=0;KB.forEach(function(x){var s=0;x.k.forEach(function(k){if(q.indexOf(nz(k))>-1)s+=k.length});if(s>bs){bs=s;best=x}});return best?L(best.fr,best.en):null}
function aiAnswer(raw){
  var q=nz(raw),pr=period(q),pd=findBy(S.products,q),cu=findBy(S.customers,q),s,b;
  if(!q.trim())return tx('Posez-moi une question sur votre boutique.','Ask me something about your shop.');
  var isProfit=anyOf(q,['benefice','profit','gagn','marge','earn','margin']),
   isSales=anyOf(q,['vente','vendu','vend','recette','sales','sold','sell','revenue','chiffre d']),
   isExp=anyOf(q,['depense','charge','expense','spent','spend','loyer']),
   isDebt=anyOf(q,['dette','doit','doivent','credit','owe','debt','impaye','unpaid']),
   isLow=anyOf(q,['racheter','reapprov','manque','rupture','finir','epuis','restock','low stock','stock bas','stock faible','running out','acheter','commander','buy','reorder']),
   isBest=anyOf(q,['meilleur','best','top ','plus vendu','populaire','popular']),
   isRent=anyOf(q,['rentable','profitable']),
   isVal=anyOf(q,['valeur du stock','stock value','valeur stock']),
   isStock=anyOf(q,['stock','inventaire','inventory']),
   isHelp=anyOf(q,['aide','help','comment','how do','how to','utiliser']),
   isTip=anyOf(q,['conseil','advice','astuce','tip','suggest','recommand']),
   isHi=/^(bonjour|bonsoir|salut|hello|hi|hey|coucou)\b/.test(q.trim());
  if(isVal){var sp=S.products.reduce(function(a,p){return a+Math.max(p.qty,0)*p.price},0);
    return L('Valeur du stock : '+fmt(stockVal())+' au prix d’achat, '+fmt(sp)+' au prix de vente ('+S.products.length+' produits).','Stock value: '+fmt(stockVal())+' at purchase price, '+fmt(sp)+' at selling price ('+S.products.length+' products).')}
  if(isRent){
    var mg=S.products.filter(function(p){return p.cost>0&&p.price>0}).map(function(p){return {p:p,m:(p.price-p.cost)/p.price}}).sort(function(a,b){return b.m-a.m}).slice(0,3);
    if(!mg.length)return tx('Renseignez le prix d’achat de vos produits pour que je calcule les marges.','Enter your products’ purchase prices so I can work out margins.');
    return tx('Produits les plus rentables :\n','Most profitable products:\n')+mg.map(function(x){return '• '+x.p.name+' : '+Math.round(x.m*100)+'% ('+fmt(money(x.p.price-x.p.cost))+tx(' par ',' per ')+(x.p.unit||t('unit'))+')'}).join('\n');
  }
  if(isBest){
    var bp=pr.ex?pr:period('semaine'),tp=topProducts(bp,5);
    if(!tp.length)return L('Pas encore de ventes '+bp.lbl+'.','No sales yet '+bp.lbl+'.');
    return L('Meilleurs produits '+bp.lbl+' :\n','Best products '+bp.lbl+':\n')+tp.map(function(a,i){return (i+1)+'. '+a.n+' — '+fmt(money(a.r))+' ('+fmtQ(a.q)+' '+(a.u||'')+')'}).join('\n');
  }
  if(cu&&(isDebt||!pd)){
    b=balance(cu.id);
    return b>0?L(cu.name+' vous doit '+fmt(b)+'.'+(cu.phone?' Relancez-le depuis Clients (WhatsApp).':''),cu.name+' owes you '+fmt(b)+'.'+(cu.phone?' Remind them from Customers (WhatsApp).':''))
      :L(cu.name+' est à jour : rien à payer.',cu.name+' is settled: nothing owed.');
  }

    var arr=S.customers.map(function(c){return {c:c,b:balance(c.id)}}).filter(function(x){return x.b>0}).sort(function(a,b){return b.b-a.b});
    if(!arr.length)return tx('Personne ne vous doit d’argent. 🎉','Nobody owes you money. 🎉');
    return L('Total à recouvrer : '+fmt(totalDebt())+'\n','Total to collect: '+fmt(totalDebt())+'\n')+arr.slice(0,6).map(function(x){return '• '+x.c.name+' : '+fmt(x.b)}).join('\n')+tx('\nRelancez-les sur WhatsApp depuis l’onglet Clients.','\nRemind them on WhatsApp from the Customers tab.');
  }
  if(isLow)return restockText();
  if(isExp){
    s=stats(pr);if(!s.exl.length)return L('Aucune dépense notée '+pr.lbl+'. Ajoutez-en dans Plus → Dépenses.','No expenses recorded '+pr.lbl+'. Add some in More → Expenses.');
    var by={};s.exl.forEach(function(e){by[e.cat]=(by[e.cat]||0)+e.amount});
    return L('Dépenses '+pr.lbl+' : '+fmt(s.ex)+'\n','Expenses '+pr.lbl+': '+fmt(s.ex)+'\n')+Object.keys(by).sort(function(a,b){return by[b]-by[a]}).slice(0,5).map(function(c){return '• '+ecLbl(c)+' : '+fmt(money(by[c]))}).join('\n');
  }
  if(pd&&(isSales||isProfit)){

  }
  if(isSales){
    s=stats(pr);if(!s.n)return L('Aucune vente '+pr.lbl+'.','No sales '+pr.lbl+'.');
    var t1=topProducts(pr,1)[0];
    return L('Ventes '+pr.lbl+' : '+fmt(s.tot)+' ('+s.n+' vente(s), '+fmtQ(s.qty)+' articles).','Sales '+pr.lbl+': '+fmt(s.tot)+' ('+s.n+' sale(s), '+fmtQ(s.qty)+' items).')+(t1?L('\nMeilleur produit : '+t1.n+' ('+fmtQ(t1.q)+' '+(t1.u||'')+').','\nBest product: '+t1.n+' ('+fmtQ(t1.q)+' '+(t1.u||'')+').'):'');
  }
  if(pd){
    var wk=stats(period('semaine'),pd.id),mpc=pd.cost>0?Math.round((pd.price-pd.cost)/pd.price*100):null;
    return L(pd.name+' : '+fmt(pd.price)+' / '+(pd.unit||t('unit'))+(pd.cost?', achat '+fmt(pd.cost)+' (marge '+mpc+'%)':', prix d’achat non renseigné')+'.\nEn stock : '+fmtQ(pd.qty)+' '+(pd.unit||'')+(pd.qty<=pd.low?' ⚠️':'')+'. Vendu sur 7 jours : '+fmtQ(wk.qty)+'.',
      pd.name+': '+fmt(pd.price)+' / '+(pd.unit||t('unit'))+(pd.cost?', cost '+fmt(pd.cost)+' (margin '+mpc+'%)':', purchase price not set')+'.\nIn stock: '+fmtQ(pd.qty)+' '+(pd.unit||'')+(pd.qty<=pd.low?' ⚠️':'')+'. Sold in 7 days: '+fmtQ(wk.qty)+'.');
  }
  if(isStock)return L('Valeur du stock : '+fmt(stockVal())+' ('+S.products.length+' produits).\n','Stock value: '+fmt(stockVal())+' ('+S.products.length+' products).\n')+restockText();
  if(isTip){
    var tips=[],lw=lowList(),dbt=S.customers.map(function(c){return {c:c,b:balance(c.id)}}).filter(function(x){return x.b>0}).sort(function(a,b){return b.b-a.b}),nc=S.products.filter(function(p){return !p.cost}).length,neg=S.products.filter(function(p){return p.cost>0&&p.price<p.cost})[0];
    if(lw.length)tips.push(L('Réapprovisionnez : '+lw.slice(0,3).map(function(p){return p.name}).join(', ')+'.','Restock: '+lw.slice(0,3).map(function(p){return p.name}).join(', ')+'.'));

  }

  return tx('Je n’ai pas bien compris. Essayez : « bénéfice du jour », « qui me doit ? », « que racheter ? », « ventes de la semaine » ou le nom d’un produit.','I did not quite get that. Try: “today’s profit”, “who owes me?”, “what to restock?”, “sales this week” or a product name.');
}
function intelMonthData(){
  var now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1),end=new Date(now.getFullYear(),now.getMonth()+1,1),prevStart=new Date(now.getFullYear(),now.getMonth()-1,1);
  var cur=S.sales.filter(function(x){return !x.void&&x.ts>=start.getTime()&&x.ts<end.getTime()});
  var prev=S.sales.filter(function(x){return !x.void&&x.ts>=prevStart.getTime()&&x.ts<start.getTime()});
  var revenue=cur.reduce(function(a,x){return a+(Number(x.total)||0)},0),prevRevenue=prev.reduce(function(a,x){return a+(Number(x.total)||0)},0);
  var gross=cur.reduce(function(a,x){return a+saleProfit(x)},0),expenses=S.expenses.filter(function(x){return x.ts>=start.getTime()&&x.ts<end.getTime()}).reduce(function(a,x){return a+(Number(x.amount)||0)},0);
  var agg={};cur.forEach(function(x){(x.items||[]).forEach(function(i){var k=i.name||'Produit';var v=agg[k]||(agg[k]={name:k,qty:0,revenue:0});v.qty+=Number(i.qty)||0;v.revenue+=(Number(i.price)||0)*(Number(i.qty)||0)})});
  var top=Object.keys(agg).map(function(k){return agg[k]}).sort(function(a,b){return b.revenue-a.revenue}).slice(0,5);
  var low=lowList().slice(0,8).map(function(x){return {name:x.name,qty:x.qty,low:x.low}});
  var costMissing=S.products.filter(function(x){return !(Number(x.cost)>0)}).length;
  var growth=prevRevenue>0?((revenue-prevRevenue)/prevRevenue*100):null;
  return {month:start.toLocaleDateString(lang()==='fr'?'fr-FR':'en-GB',{month:'long',year:'numeric'}),salesCount:cur.length,revenue:money(revenue),grossProfit:money(gross),expenses:money(expenses),netProfit:money(gross-expenses),previousRevenue:money(prevRevenue),growth:growth,topProducts:top,lowStock:low,totalDebt:money(totalDebt()),productCount:S.products.length,missingPurchaseCosts:costMissing,hasPrevious:prev.length>0};
}

function intelRecommendations(d){
  var out=[];
  if(!d.salesCount)out.push(L('Aucune vente enregistrée ce mois-ci : commencez par enregistrer chaque vente pour obtenir un diagnostic fiable.','No sales recorded this month: record each sale to get a reliable diagnosis.'));
  if(d.growth!==null){if(d.growth<0)out.push(L('Le chiffre d’affaires recule de '+Math.abs(d.growth).toFixed(1)+' % par rapport au mois précédent. Comparez les jours faibles et vérifiez les ruptures.','Revenue is down '+Math.abs(d.growth).toFixed(1)+'% versus last month. Compare slow days and check stock-outs.'));else out.push(L('Le chiffre d’affaires progresse de '+d.growth.toFixed(1)+' % par rapport au mois précédent. Identifiez les produits qui contribuent le plus à cette hausse.','Revenue is up '+d.growth.toFixed(1)+'% versus last month. Identify the products contributing most to the increase.'));}
  else out.push(L('La comparaison avec le mois précédent sera disponible après un mois complet de données.','Comparison with the previous month will be available after a full month of data.'));
  if(d.lowStock.length)out.push(L('Priorité stock : réapprovisionnez '+d.lowStock.slice(0,3).map(function(x){return x.name}).join(', ')+'.','Stock priority: restock '+d.lowStock.slice(0,3).map(function(x){return x.name}).join(', ')+'.'));
  if(d.missingPurchaseCosts)out.push(L(d.missingPurchaseCosts+' produit(s) sans prix d’achat : complétez ces coûts pour fiabiliser le bénéfice.',''+d.missingPurchaseCosts+' product(s) have no purchase cost: add those costs to make profit figures reliable.'));
  if(d.netProfit<0)out.push(L('Le bénéfice net estimé est négatif. Examinez les dépenses et les prix de vente avant d’augmenter les achats.','Estimated net profit is negative. Review expenses and selling prices before increasing purchases.'));
  if(d.totalDebt>0)out.push(L('Des crédits restent à recouvrer : suivez les échéances et relancez les clients concernés.','Some credit remains outstanding: track due dates and remind the relevant customers.'));
  if(!out.length)out.push(L('Continuez à saisir les ventes, achats et dépenses pour affiner les recommandations.','Keep recording sales, restocks and expenses to improve recommendations.'));
  return out;
}

function cloudLoadScript(src){return new Promise(function(resolve,reject){var old=document.querySelector('script[data-supabase-sdk]');if(old&&window.supabase){resolve();return}var sc=document.createElement('script');sc.src=src;sc.async=true;sc.dataset.supabaseSdk='1';sc.onload=resolve;sc.onerror=function(){reject(new Error('Impossible de charger le client Supabase.'))};document.head.appendChild(sc)})}
async function cloudInit(){
  if(cloudAI.client)return cloudAI.client;
  if(cloudAI.initPromise)return cloudAI.initPromise;
  cloudAI.initPromise=(async function(){
    var r=await fetch('/api/config',{headers:{'Accept':'application/json'},cache:'no-store'});
    var cfg=await r.json();if(!r.ok)throw new Error(cfg.error||'Configuration cloud indisponible.');
    await cloudLoadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
    if(!window.supabase||!window.supabase.createClient)throw new Error('Bibliothèque Supabase indisponible.');
    cloudAI.client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    cloudAI.ready=true;cloudAI.error='';return cloudAI.client;
  })().catch(function(e){cloudAI.error=e.message||'Connexion cloud impossible.';cloudAI.initPromise=null;throw e});
  return cloudAI.initPromise;
}
async function cloudSession(){var c=await cloudInit();var r=await c.auth.getSession();return r.data&&r.data.session?r.data.session:null}

/* ---------- Pro : impression 58 mm (Bluetooth, ESC/POS) ---------- */
function isPro(){return paid()&&S.shop.plan==='pro'}
var BT={ch:null};
var BT_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
async function printerConnect(){
  if(BT.ch&&BT.ch.service&&BT.ch.service.device&&BT.ch.service.device.gatt.connected)return BT.ch;
  if(!navigator.bluetooth)throw new Error('nobt');
  var dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SERVICES});
  dev.addEventListener&&dev.addEventListener('gattserverdisconnected',function(){BT.ch=null});
  var server=await dev.gatt.connect();
  var services=await server.getPrimaryServices();
  for(var i=0;i<services.length;i++){
    var chars=await services[i].getCharacteristics();
    for(var j=0;j<chars.length;j++){
      if(chars[j].properties.write||chars[j].properties.writeWithoutResponse){BT.ch=chars[j];BT.ch._dev=dev;return BT.ch}
    }
  }
  throw new Error('nochar');
}
async function printerWrite(bytes){
  var c=await printerConnect();
  for(var i=0;i<bytes.length;i+=100){
    var part=bytes.slice(i,i+100);
    if(c.properties.writeWithoutResponse)await c.writeValueWithoutResponse(part);else await c.writeValue(part);
  }
}
// Les petites imprimantes 58 mm n’aiment pas les accents : on les retire
function asc(s){return String(s==null?'':s).replace(/ | /g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E\n]/g,'')}
function rowLR(a,b,w){var sp=w-a.length-b.length;return sp<1?a+' '+b:a+' '.repeat(sp)+b}
function receiptBytes(s){
  var W=32,c=s.cid?custById(s.cid):null;
  var str='\x1b@';
  str+='\x1b\x61\x01\x1b\x45\x01'+asc(S.shop.name)+'\n\x1b\x45\x00';
  str+=asc(t('rcpt')+' #'+String(s.n||0).padStart(4,'0'))+'\n'+asc(fmtDate(s.ts,{day:'numeric',month:'short',year:'numeric'})+' '+fmtTime(s.ts))+'\n\x1b\x61\x00';
  str+='-'.repeat(W)+'\n';
  s.items.forEach(function(i){
    str+=asc(i.name)+'\n';
    str+=rowLR('  '+asc(fmtQ(i.qty)+(i.unit?' '+i.unit:'')+' x '+fmtN(i.price,0)),asc(fmtN(money(i.price*i.qty),0)),W)+'\n';
  });
  str+='-'.repeat(W)+'\n';
  if(s.discount)str+=rowLR(asc(t('discLbl')),'-'+asc(fmtN(s.discount,0)),W)+'\n';
  str+='\x1b\x45\x01'+rowLR(asc(t('total')),asc(fmt(s.total)),W)+'\x1b\x45\x00\n';
  str+=asc(t('payLbl')+': '+methodLbl(s.method)+(c?' - '+c.name:''))+'\n';
  if(s.method==='credit')str+=asc(t('remainsLbl')+': '+fmt(s.debt))+'\n';
  str+='\n\x1b\x61\x01'+asc(t('thanks'))+'\n\n\n\n\x1d\x56\x42\x00';
  return new TextEncoder().encode(str);

  var L2=[];

function csvCell(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvText(){
  var rows=[['date','time','receipt','items','discount','total','payment','customer','profit'].join(',')];
  S.sales.slice().sort(function(a,b){return a.ts-b.ts}).forEach(function(s){var c=s.cid?custById(s.cid):null;
    rows.push([dk(s.ts),fmtTime(s.ts),s.n||'',s.items.map(function(i){return i.qty+' '+i.name}).join(' | '),s.discount||0,s.total,s.method,c?c.name:'',money(saleProfit(s))].map(csvCell).join(','))});
  return '﻿'+rows.join('\n');
}
async function exportFile(name,text){
  var dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:text});toast(t('saved'));return}catch(e){if(e&&e.code==='declined')return}}
  try{var b=new Blob([text],{type:/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast(t('saved'));return}catch(e){}
  if(await copyText(text))toast(t('exportCopied'));else toast(t('exportFail'));
}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){
    try{var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}
  }
}

function confirmSale(){
  if(!hasDevicePermission('sell')){requirePermission('sell',function(){confirmSale()});return}
  if(!ui.cart.length){toast(t('emptyCart'));return}
  var hs=hoursStatus(Date.now());if(!hs.open){toast(hs.msg);return}
  var p=ui.pay,x=payTotals(),i;
  for(i=0;i<ui.cart.length;i++){var c=ui.cart[i];if(c.pid){var pr=prodById(c.pid);if(pr&&c.qty>pr.qty+1e-9){toast(t('notEnough',pr.name,fmtQ(pr.qty)));return}}}
  if(p.method==='credit'){
    if(p.cid==='new'){if(!p.newName.trim()){toast(t('errCust'));return}
      var vPayNp=validatePhone('pay-np');if(!vPayNp.ok){toast(vPayNp.msg);return}p.newPhone=vPayNp.full;
      if(!paid()&&S.customers.length>=SUB_LIMIT.cust){paywall(L('Plan gratuit : '+SUB_LIMIT.cust+' clients maximum.','Free plan: '+SUB_LIMIT.cust+' customers maximum.'));return}}
    else if(!p.cid){toast(t('errCust'));return}
    else{
      /* vérifier plafond de crédit du client existant */
      var cc2=custById(p.cid);
      if(cc2&&cc2.creditMax>0){
        var curDebt=balance(cc2.id);
        var x2=payTotals();
        if(curDebt+x2.debt>cc2.creditMax){toast(lang()==='fr'?'Plafond de crédit dépassé pour ce client (max '+fmt(cc2.creditMax)+').':'Credit limit exceeded for this customer (max '+fmt(cc2.creditMax)+').');return}
      }
    }
  }
  var sale=null;
  var ok=transact(function(){
    var cid='';
    if(p.method==='credit'){
      if(p.cid==='new'){var nc={id:'c'+uid(),name:p.newName.trim(),phone:phoneValueFor('pay-np')||p.newPhone.trim()};S.customers.push(nc);cid=nc.id}
      else cid=p.cid;
    }
    ui.cart.forEach(function(c){if(c.pid){var pr=prodById(c.pid);if(pr){pr.qty=Math.max(0,Math.round((pr.qty-c.qty)*1000)/1000);addMove(pr,'sale',-c.qty,'#'+((S.seq||0)+1))}}});
    S.seq=(S.seq||0)+1;
    sale={id:'s'+uid(),n:S.seq,ts:Date.now(),items:ui.cart.map(function(c){return {pid:c.pid,name:c.name,unit:c.unit,qty:c.qty,price:c.price,cost:c.cost}}),subtotal:x.sub,discount:x.disc,total:x.total,method:p.method,cid:cid,debt:x.debt,received:p.method==='cash'?x.rec:0,void:false};
    S.sales.push(sale);
    audit('Vente','#'+sale.n+' · '+fmt(sale.total)+' · '+methodLbl(sale.method)+(sale.debt?' · reste '+fmt(sale.debt):''));
  });
  if(!ok)return;
  ui.cart=[];ui.pay=payDefault();
  render();refreshSell();receiptSheet(sale.id,true);
}

  function draw(el,w,h){

    var m=Math.min(w,h),sx=(w-m)/2,sy=(h-m)/2;x.drawImage(el,sx,sy,m,m,0,0,256,256);
    cb(c.toDataURL('image/jpeg',0.8));
  }
  if(isVideo){
    var v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=src;
    v.onloadeddata=function(){v.currentTime=Math.min(1,(v.duration||1)/2)};
    v.onseeked=function(){draw(v,v.videoWidth,v.videoHeight)};
    v.onerror=function(){toast(tx('Vidéo illisible. Essayez une autre prise.','Unreadable video. Try again.'))};
  }else{
    var im=new Image();im.onload=function(){draw(im,im.naturalWidth,im.naturalHeight)};
    im.onerror=function(){toast(tx('Image illisible.','Unreadable image.'))};im.src=src;
  }
}

function csvImport(kind,text){
  var fr=lang()==='fr';
  var rows=text.split(/\r?\n/).map(function(l){return l.split(/[;,]/).map(function(c){return c.trim().replace(/^"|"$/g,'')})}).filter(function(r){return r[0]});
  if(rows.length&&/^(nom|name)$/i.test(rows[0][0]))rows.shift();
  if(!rows.length){toast(tx('Fichier vide ou illisible.','Empty or unreadable file.'));return}
  if(kind==='prod'){
    if(!paid()&&S.products.length+rows.length>SUB_LIMIT.prod){toast(tx('Limite de 50 produits en Découverte.','50-product limit on Starter.'));return}
    rows.forEach(function(r){var o={id:'p'+uid(),name:r[0],price:money(num(r[1])),cost:money(num(r[2])),qty:num(r[3]),low:2,unit:'',cat:'',img:''};S.products.push(o);if(o.qty>0)addMove(o,'init',o.qty,'')});
    audit('Import produits',rows.length+' produit(s)');
  }else{
    if(!paid()&&S.customers.length+rows.length>SUB_LIMIT.cust){toast(tx('Limite de 20 clients en Découverte.','20-customer limit on Starter.'));return}
    rows.forEach(function(r){S.customers.push({id:'c'+uid(),name:r[0],phone:r[1]||''})});
    audit('Import clients',rows.length+' client(s)');
  }
  save();render();toast(fr?rows.length+' ligne(s) importée(s).':rows.length+' row(s) imported.');
}
